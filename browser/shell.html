<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, interactive-widget=resizes-visual"
    />
    <title>Codex Pokétibia</title>
    <style>
      body {
        margin: 0;
        background-color: black;
        overscroll-behavior: contain;
      }
      .backbuffer {
        position: absolute;
        top: 0px;
        left: 0px;
        margin: 0px;
        border: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: block;
        image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -o-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: optimize-contrast;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
      }
      .title {
        pointer-events: none;
        position: absolute;
        top: 10px;
        margin-top: 0px;
        padding-left: 10px;
        color: white;
        text-decoration: none;
        z-index: 1;
        text-align: left;
        font-family: "Roboto", Helvetica, sans-serif;
        font-size: 20px;
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
      }
      #start {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        font: 700 1.6rem "Roboto", Helvetica, sans-serif;
        padding: 14px 48px;
        border: 0;
        border-radius: 10px;
        background: #e3350d;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 6px 24px rgba(227, 53, 13, 0.45);
        display: none;
      }
      #start:hover { background: #ff4a1f; }
      /* CODEX celular */
      #codexTecladoBtn {
        position: absolute;
        left: 10px;
        bottom: 135px; /* acima do joystick, longe dos botoes de acao */
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(10, 16, 32, 0.55);
        color: #fff;
        font-size: 22px;
        z-index: 5;
        display: none;
        touch-action: none;
      }
      #codexTecladoBtn.ativo { background: rgba(227, 53, 13, 0.75); }
      #codexTeclado {
        position: fixed;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        border: 0;
        padding: 0;
        font-size: 16px; /* evita zoom automatico no iPhone */
        z-index: 0;
      }
      #codexGire {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: #070b16;
        color: #fff;
        font: 600 18px "Roboto", Helvetica, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #codexGire span { font-size: 54px; }
      /* so pede para girar depois de entrar no jogo (login funciona em pe) */
      @media (orientation: portrait) and (pointer: coarse) {
        body.codexNoJogo #codexGire { display: flex; }
      }
      #aviso {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        color: #9aa4b2;
        font: 14px "Roboto", Helvetica, sans-serif;
        text-align: center;
        z-index: 2;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      class="title"
      id="title-text"
      contenteditable
      virtualkeyboardpolicy="manual"
    ></div>
    <button id="start" onclick="startGame()">Jogar</button>
    <div id="aviso">Codex Pokétibia — primeira abertura baixa os arquivos do jogo; nas próximas abre mais rápido.</div>
    <div id="codexGire"><span>📱↻</span>Gire o celular para jogar na horizontal</div>
    <button id="codexTecladoBtn" aria-label="Teclado">⌨</button>
    <input id="codexTeclado" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <canvas
      class="backbuffer"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="0"
    ></canvas>
    <script type="text/javascript">
      var canvas = document.getElementById("canvas");
      function reportRuntimeError(prefix, error) {
        const payload = [prefix, error]
          .flat()
          .filter(Boolean)
          .map((entry) => {
            if (!entry) return "";
            if (typeof entry === "string") {
              return entry;
            }
            if (entry.stack) {
              return entry.stack;
            }
            try {
              return JSON.stringify(entry);
            } catch (_) {
              return String(entry);
            }
          })
          .join(": ");
        console.error(payload);
        const title = document.getElementById("title-text");
        if (title) {
          title.innerHTML = "Erro ao rodar o jogo – aperte F12 e veja o Console";
        }
      }
      function startGame() {
        document.getElementById("start").style.display = "none";
        document.getElementById("aviso").style.display = "none";
        if (CODEX_CELULAR) document.getElementById("codexTecladoBtn").style.display = "block";
        if (CODEX_CELULAR) codexTelaCheia();
        callMain();
        document.addEventListener("touchstart", function (ev) {
          if (codexEhNosso(ev.target)) return;
          ev.preventDefault();
          ev.stopPropagation();
        }, { passive: false });
        document.addEventListener("touchmove", function (ev) {
          if (codexEhNosso(ev.target)) return;
          ev.preventDefault();
          ev.stopPropagation();
        }, { passive: false });
        document.addEventListener("touchend", function (ev) {
          if (codexEhNosso(ev.target)) return;
          ev.preventDefault();
          ev.stopPropagation();
        }, { passive: false });
        document.addEventListener("keyup", function (ev) {
          if (codexEhNosso(ev.target)) return;
          ev.preventDefault();
          ev.stopPropagation();
        });
        document.addEventListener("keydown", function (ev) {
          if (codexEhNosso(ev.target)) return;
          if (
            !ev.ctrlKey &&
            ev.key !== "Enter" &&
            ev.key !== "Escape" &&
            ev.key !== "Backspace" &&
            ev.key !== "ArrowLeft" &&
            ev.key !== "ArrowRight" &&
            ev.key !== "ArrowUp" &&
            ev.key !== "ArrowDown"
          ) {
            canvas.dispatchEvent(new KeyboardEvent("keypress", ev));
          } else if (ev.ctrlKey && ev.key === "v") {
            return true;
          }
          ev.preventDefault();
          ev.stopPropagation();
        });
      }
      // ===== CODEX: celular =====
      var CODEX_CELULAR = (function () {
        try {
          return (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ||
            /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        } catch (e) { return false; }
      })();
      function codexEhNosso(el) {
        return el && (el.id === "codexTeclado" || el.id === "codexTecladoBtn" || el.id === "start");
      }
      function codexTelaCheia() {
        try {
          var el = document.documentElement;
          var p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: "hide" }) :
            (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      }
      // chamado pelo cliente: entrou no jogo = trava deitado; saiu = livre
      window.codexModoJogo = function (noJogo) {
        // trocou de tela (login <-> jogo): fecha o teclado e solta a tela congelada,
        // senao o jogo fica preso no tamanho de antes de girar
        if (document.body.classList.contains("codexNoJogo") !== !!noJogo) {
          codexFecharTeclado();
          codexSoltarTela();
        }
        document.body.classList.toggle("codexNoJogo", !!noJogo);
        window.codexTecladoTravado = !!noJogo;
        try {
          if (noJogo && screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
          else if (!noJogo && screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        } catch (e) {}
      };
      // envia teclas para o jogo (o cliente escuta o window)
      function codexTecla(tipo, key, code, keyCode) {
        window.dispatchEvent(new KeyboardEvent(tipo, { key: key, code: code, keyCode: keyCode, which: keyCode, charCode: tipo === "keypress" ? keyCode : 0, bubbles: true }));
      }
      function codexEnviarTexto(txt) {
        for (const ch of txt) codexTecla("keypress", ch, "", ch.codePointAt(0));
      }
      function codexEnter() {
        codexTecla("keydown", "Enter", "Enter", 13);
        codexTecla("keypress", "Enter", "Enter", 13);
        codexTecla("keyup", "Enter", "Enter", 13);
      }
      function codexApagar() {
        codexTecla("keydown", "Backspace", "Backspace", 8);
        codexTecla("keyup", "Backspace", "Backspace", 8);
      }
      // Teclado aberto: a tela do jogo NAO encolhe (senao tudo se redesenha espremido).
      // Ela fica do mesmo tamanho e sobe so o necessario para o campo de texto aparecer.
      var codexTela = null;   // tamanho da tela quando o teclado abriu
      var codexCampo = null;  // parte de baixo do campo de texto (px da tela)
      function codexReposicionar() {
        var c = document.getElementById("canvas");
        if (!codexTela || !c) return;
        var vv = window.visualViewport;
        var visivel = vv ? vv.height : window.innerHeight;
        var topo = vv ? vv.offsetTop : 0;
        var desloc = Math.max(0, Math.min(codexTela.h - visivel, codexCampo + 12 - visivel));
        c.style.transform = "translateY(" + (topo - desloc) + "px)";
      }
      function codexCongelarTela(campo) {
        if (!CODEX_CELULAR) return;
        var c = document.getElementById("canvas");
        if (!c) return;
        if (!codexTela) {
          var r = c.getBoundingClientRect();
          codexTela = { w: r.width, h: r.height };
          c.style.width = r.width + "px";
          c.style.height = r.height + "px";
        }
        codexCampo = typeof campo === "number" && campo > 0 ? campo : codexTela.h; // sem campo: chat (embaixo)
        codexReposicionar();
        setTimeout(codexReposicionar, 350); // depois que o teclado termina de abrir
      }
      function codexSoltarTela() {
        var c = document.getElementById("canvas");
        codexTela = null;
        codexCampo = null;
        if (c) { c.style.width = ""; c.style.height = ""; c.style.transform = ""; }
        window.scrollTo(0, 0);
      }
      // girou o celular: o tamanho guardado nao vale mais
      function codexGirou() {
        codexFecharTeclado();
        codexSoltarTela();
      }
      window.addEventListener("orientationchange", codexGirou);
      if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener("change", codexGirou);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", codexReposicionar);
        window.visualViewport.addEventListener("scroll", codexReposicionar);
      }
      // no jogo o teclado so abre pelo botao do chat (forcar = true); tocar no campo nao abre
      window.codexTecladoTravado = false;
      window.codexAbrirTeclado = function (campo, forcar) {
        var inp = document.getElementById("codexTeclado");
        if (!inp) return;
        if (window.codexTecladoTravado && !forcar) return;
        codexCongelarTela(campo);
        inp.value = " ";
        inp.focus({ preventScroll: true });
        try { inp.setSelectionRange(1, 1); } catch (e) {}
        document.getElementById("codexTecladoBtn").classList.add("ativo");
      };
      function codexFecharTeclado() {
        var inp = document.getElementById("codexTeclado");
        if (inp) inp.blur();
        document.getElementById("codexTecladoBtn").classList.remove("ativo");
      }
      window.codexFecharTeclado = codexFecharTeclado;
      window.addEventListener("DOMContentLoaded", function () {
        var btn = document.getElementById("codexTecladoBtn");
        var inp = document.getElementById("codexTeclado");
        if (!CODEX_CELULAR) return;
        // arrastar o botao muda ele de lugar (fica salvo); toque rapido abre/fecha o teclado
        var CHAVE_BTN = "codexTecladoPos";
        function colocarBtn(x, y) {
          var w = btn.offsetWidth || 46, h = btn.offsetHeight || 46;
          x = Math.max(0, Math.min(x, window.innerWidth - w));
          y = Math.max(0, Math.min(y, window.innerHeight - h));
          btn.style.left = x + "px";
          btn.style.top = y + "px";
          btn.style.bottom = "auto";
          btn.style.right = "auto";
        }
        try {
          var salvo = JSON.parse(localStorage.getItem(CHAVE_BTN) || "null");
          if (salvo && typeof salvo.x === "number") colocarBtn(salvo.x, salvo.y);
        } catch (e) {}
        var arraste = null;
        btn.addEventListener("touchstart", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          var t = ev.changedTouches[0], r = btn.getBoundingClientRect();
          arraste = { sx: t.clientX, sy: t.clientY, dx: t.clientX - r.left, dy: t.clientY - r.top, movendo: false };
        }, { passive: false });
        btn.addEventListener("touchmove", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          if (!arraste) return;
          var t = ev.changedTouches[0];
          if (!arraste.movendo && Math.abs(t.clientX - arraste.sx) + Math.abs(t.clientY - arraste.sy) < 10) return;
          arraste.movendo = true;
          colocarBtn(t.clientX - arraste.dx, t.clientY - arraste.dy);
        }, { passive: false });
        btn.addEventListener("touchend", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          var a = arraste;
          arraste = null;
          if (a && a.movendo) {
            try {
              var r = btn.getBoundingClientRect();
              localStorage.setItem(CHAVE_BTN, JSON.stringify({ x: r.left, y: r.top }));
            } catch (e) {}
            return;
          }
          if (document.activeElement === inp) codexFecharTeclado(); else window.codexAbrirTeclado();
        }, { passive: false });
        btn.addEventListener("click", function () {
          if (document.activeElement === inp) codexFecharTeclado(); else window.codexAbrirTeclado();
        });
        inp.addEventListener("beforeinput", function (ev) {
          var t = ev.inputType || "";
          if (t === "insertText" || t === "insertReplacementText" || t === "insertCompositionText") {
            if (ev.data && t !== "insertCompositionText") codexEnviarTexto(ev.data);
          } else if (t === "deleteContentBackward") {
            codexApagar();
          } else if (t === "insertLineBreak" || t === "insertParagraph") {
            codexEnter();
          }
          if (t !== "insertCompositionText") ev.preventDefault();
        });
        // teclados que digitam por composicao (Android): manda a palavra quando termina
        inp.addEventListener("compositionend", function (ev) {
          if (ev.data) codexEnviarTexto(ev.data);
          inp.value = " ";
          try { inp.setSelectionRange(1, 1); } catch (e) {}
        });
        // as teclas "de verdade" do teclado do celular NAO podem subir ate a janela:
        // o jogo escuta a janela e ai cada letra entrava duas vezes
        inp.addEventListener("keydown", function (ev) {
          ev.stopPropagation();
          if (ev.key === "Enter") { ev.preventDefault(); codexEnter(); }
        });
        inp.addEventListener("keypress", function (ev) { ev.stopPropagation(); });
        inp.addEventListener("keyup", function (ev) { ev.stopPropagation(); });
        inp.addEventListener("blur", function () {
          btn.classList.remove("ativo");
          setTimeout(function () {
            if (document.activeElement !== inp) codexSoltarTela();
          }, 150);
        });
      });

      var Module = {
        locateFile: function (path) {
          const baseURL =
            window.location.origin +
            window.location.pathname.substring(
              0,
              window.location.pathname.lastIndexOf("/")
            );
          // CODEX: versao colocada pelo instalar_web.sh (evita misturar arquivos de versoes diferentes)
          const v = "__CODEX_V__";
          return baseURL + "/" + path + (v.indexOf("__") === 0 ? "" : "?v=" + v);
        },
        preRun: [
          function () {
            addRunDependency("syncfs");
            if (!FS.analyzePath("/user").exists) FS.mkdir("/user");
            FS.mount(IDBFS, { autoPersist: true }, "/user");
            FS.syncfs(true, function (err) {
              if (err) {
                Module.print(err);
              }
              removeRunDependency("syncfs");
            });
          },
        ],
        postRun: [],
        print: (function () {
          return function (text) {
            text = Array.prototype.slice.call(arguments).join(" ");
            console.log(text);
          };
        })(),
        printErr: function () {
          console.warn(Array.prototype.slice.call(arguments).join(" "));
        },
        canvas: (function () {
          var canvas = document.getElementById("canvas");
          return canvas;
        })(),
        onAbort: function (reason) {
          reportRuntimeError("abort", reason || "unknown reason");
        },
        setStatus: function (text) {
          console.log("status: " + text);
          let display = "";
          if (text.includes("Running...")) {
            display = "";
            document.getElementById("start").style.display = "block";
          } else if (text.includes("Downloading data...")) {
            const m = text.match(/\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)/);
            display = m ? "Baixando o jogo... " + Math.floor((m[1] / m[2]) * 100) + "%" : "Baixando o jogo...";
          }

          document.getElementById("title-text").innerHTML = display;
        },
        monitorRunDependencies: function (left) {
          console.log("monitor run deps: " + left);
          document.getElementById("title-text").innerHTML = "Preparando...";
        },
      };
      window.onerror = function (message, source, lineno, colno, error) {
        reportRuntimeError("window.onerror", error || message);
      };
      window.addEventListener("unhandledrejection", function (event) {
        reportRuntimeError("unhandledrejection", event.reason || "Promise rejected");
      });
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
