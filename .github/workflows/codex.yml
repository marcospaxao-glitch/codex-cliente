# ============================================================
# CODEX - compila o cliente no GitHub (gratis, sem instalar nada no PC)
# Actions > "Codex - compilar" > Run workflow > escolha o alvo.
# O resultado sai em "Artifacts" no fim da execucao.
# ============================================================
name: Codex - compilar

on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "O que compilar"
        type: choice
        options: [windows, navegador, os-dois]
        default: windows
      console:
        description: "Windows: abrir janela de console junto (versao de teste)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: codex-${{ github.ref }}-${{ inputs.alvo }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.exe)
    if: inputs.alvo == 'windows' || inputs.alvo == 'os-dois'
    runs-on: windows-2025-vs2026
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache,readwrite"
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Versao do vcpkg
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          "VCPKG_GIT_COMMIT_ID=$($json.'builtin-baseline')" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path vcpkg-cache | Out-Null
          Remove-Item -Recurse -Force C:\mysql* -ErrorAction SilentlyContinue

      - name: Cache das bibliotecas (deixa as proximas compilacoes bem mais rapidas)
        uses: actions/cache@v5
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-

      - name: Preparar vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: "https://github.com/microsoft/vcpkg.git"
          vcpkgGitCommitId: ${{ env.VCPKG_GIT_COMMIT_ID }}

      - name: Compilar
        uses: lukka/run-cmake@v10
        with:
          configurePreset: windows-release
          buildPreset: windows-release
          configurePresetAdditionalArgs: "['-DTOGGLE_BIN_FOLDER=ON', '-DOPTIONS_ENABLE_IPO=OFF', '-DOTCLIENT_BUILD_TESTS=OFF', '-DCODEX_CONSOLE=${{ inputs.console && 'ON' || 'OFF' }}']"

      - name: Montar a pasta do cliente
        shell: pwsh
        run: |
          $out = "Codex-Windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/windows-release/bin/* $out -Recurse -Force
          foreach ($p in @('init.lua', 'otclientrc.lua', 'config.ini', 'cacert.pem')) { if (Test-Path $p) { Copy-Item $p $out -Force } }
          foreach ($d in @('data', 'modules', 'mods')) { if (Test-Path $d) { Copy-Item $d $out -Recurse -Force } }
          if (Test-Path "$out/otclient.exe") { Rename-Item "$out/otclient.exe" "Codex.exe" }
          New-Item -ItemType Directory -Force -Path "$out/ferramentas" | Out-Null
          if (Test-Path "$out/pkpacker.exe") { Move-Item "$out/pkpacker.exe" "$out/ferramentas/pkpacker.exe" -Force }
          Remove-Item "$out/*.ilk" -Force -ErrorAction SilentlyContinue
          # .pdb (nomes das funcoes para o crashreport.log): so na versao de teste (console)
          if ("${{ inputs.console }}" -ne "true") { Remove-Item "$out/*.pdb" -Force -ErrorAction SilentlyContinue }
          Set-Content -Path "$out/LEIA_DIAGNOSTICO.txt" -Value "Se o cliente fechar sozinho: crie um arquivo vazio chamado codex_debug.txt nesta pasta e abra de novo. Ele vai gravar codex_passos.txt com cada passo da abertura."
          if ("${{ inputs.console }}" -eq "true") { Set-Content -Path "$out/ABRIR_COM_LOG.bat" -Value "@echo off`r`ncd /d `"%~dp0`"`r`necho Abrindo o Codex... (os erros aparecem aqui e ficam salvos em saida.txt)`r`nCodex.exe > saida.txt 2>&1`r`necho.`r`necho O Codex fechou com codigo %errorlevel%.`r`ntype saida.txt | more`r`npause" }
          Set-Content -Path "$out/COLOQUE_O_SPR_AQUI.txt" -Value "Copie o seu Tibia.spr para data\things\1098\ (ele nao vai no GitHub por ser grande demais)."
          Get-ChildItem $out | Format-Table Name, Length

      - name: Enviar resultado
        uses: actions/upload-artifact@v7
        with:
          name: Codex-Windows
          path: Codex-Windows/
          retention-days: 14

  navegador:
    name: Navegador (WebAssembly)
    if: inputs.alvo == 'navegador' || inputs.alvo == 'os-dois'
    runs-on: ubuntu-latest
    env:
      BUILD_LOG: docker-browser-build.log
      OUTPUT_DIR: build-emscripten-web
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      # CODEX: Docker com cache do GitHub. A parte pesada (Emscripten + bibliotecas)
      # fica guardada; as proximas compilacoes so refazem o codigo do cliente.
      - name: Preparar Docker com cache
        uses: docker/setup-buildx-action@v3

      - name: Compilar com Docker (Emscripten)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.browser
          tags: otclient-web:latest
          load: true
          cache-from: type=gha,scope=codex-web
          cache-to: type=gha,mode=max,scope=codex-web

      - name: Tirar o resultado do Docker
        run: |
          rm -rf "$OUTPUT_DIR"
          echo "compilado com cache do GitHub (veja o log do passo anterior)" > "$BUILD_LOG"
          docker rm -f otclient-web-tmp >/dev/null 2>&1 || true
          docker create --name otclient-web-tmp otclient-web:latest
          docker cp otclient-web-tmp:/otclient-web "$OUTPUT_DIR"
          docker rm otclient-web-tmp
          ls -la "$OUTPUT_DIR"

      - name: Enviar resultado
        uses: actions/upload-artifact@v7
        with:
          name: Codex-Navegador
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.OUTPUT_DIR }}
          retention-days: 14
